<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Steeecks Chat</title>
<meta name="theme-color" content="#241a13">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  *{margin:0; padding:0; box-sizing:border-box;}
  :root{
    --bark:#241a13; --honey-bright:#e0a854; --parchment:#efe6d0; --bone:#faf6ef;
  }
  html, body{height:100%; overflow:hidden;}
  body{
    font-family:'Work Sans', -apple-system, sans-serif;
    background:
      linear-gradient(180deg, rgba(20,14,9,0.88) 0%, rgba(20,14,9,0.93) 100%),
      url('images/card-texture.webp') center / cover no-repeat;
    color:var(--bone);
    display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top, 0px);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }

  /* ===== Auth gate ===== */
  #gate{
    display:flex; align-items:center; justify-content:center; flex:1; text-align:center; padding:2rem;
  }
  #gate a{color:var(--honey-bright); font-weight:600;}

  /* ===== App shell ===== */
  #app{display:none; flex-direction:column; height:100%; flex:1; min-height:0;}
  #app.ready{display:flex;}

  header{
    padding:1rem 1.2rem 0.8rem;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid rgba(250,246,239,0.15);
    background:rgba(20,14,9,0.5);
    backdrop-filter:blur(6px);
  }
  header h1{font-size:1.15rem; font-weight:700;}
  #notifyBtn{
    background:var(--honey-bright); color:var(--bark); border:none; border-radius:8px;
    padding:0.5rem 0.8rem; font-size:0.8rem; font-weight:600; cursor:pointer;
  }
  #notifyBtn.granted{background:rgba(250,246,239,0.15); color:var(--bone);}

  .tabs{display:flex; border-bottom:1px solid rgba(250,246,239,0.15); background:rgba(20,14,9,0.4);}
  .tab-btn{
    flex:1; padding:0.85rem; background:none; border:none; color:rgba(250,246,239,0.6);
    font-size:0.9rem; font-weight:600; cursor:pointer; position:relative;
  }
  .tab-btn.active{color:var(--honey-bright);}
  .tab-btn.active::after{content:''; position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--honey-bright);}
  .tab-count{
    display:inline-block; background:#c94b3e; color:#fff; border-radius:10px;
    font-size:0.68rem; padding:0.05rem 0.4rem; margin-left:0.35rem; min-width:1.2em;
  }

  #main{flex:1; min-height:0; display:flex; overflow:hidden;}

  /* Session list */
  #sessionList{width:100%; overflow-y:auto; flex-shrink:0;}
  .session-item{
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:0.9rem 1.2rem; border-bottom:1px solid rgba(250,246,239,0.08);
    color:var(--bone); cursor:pointer;
  }
  .session-item:active, .session-item.selected{background:rgba(224,168,84,0.12);}
  .session-item .sname{font-weight:600; font-size:0.95rem; display:flex; justify-content:space-between;}
  .session-item .stime{font-size:0.72rem; opacity:0.55; font-weight:400;}
  .session-item .spreview{font-size:0.83rem; opacity:0.75; margin-top:0.2rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #emptyState{padding:2.5rem 1.5rem; text-align:center; opacity:0.6; font-size:0.9rem;}

  /* Thread view */
  #threadView{
    display:none; width:100%; flex-direction:column; height:100%; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(20,14,9,0.92) 0%, rgba(20,14,9,0.95) 100%),
      url('images/card-texture.webp') center / cover no-repeat;
    padding-top:env(safe-area-inset-top, 0px);
  }
  #threadView.open{display:flex;}
  #threadHeader{
    padding:1rem 1.2rem; display:flex; align-items:center; gap:0.8rem;
    border-bottom:1px solid rgba(250,246,239,0.15);
  }
  #backBtn{background:none; border:none; color:var(--bone); font-size:1.3rem; cursor:pointer; padding:0.2rem 0.4rem;}
  #threadName{font-weight:700; font-size:1rem;}
  #threadMessages{flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.6rem;}
  .msg{max-width:78%; padding:0.6rem 0.85rem; border-radius:12px; font-size:0.9rem; line-height:1.45;}
  .msg.customer{align-self:flex-start; background:rgba(250,246,239,0.12); border-bottom-left-radius:3px;}
  .msg.admin{align-self:flex-end; background:var(--honey-bright); color:var(--bark); border-bottom-right-radius:3px;}
  #threadForm{
    display:flex; gap:0.6rem; padding:0.8rem; border-top:1px solid rgba(250,246,239,0.15);
    padding-bottom:calc(0.8rem + env(safe-area-inset-bottom, 0px));
  }
  #threadInput{
    flex:1; padding:0.7rem 0.9rem; border-radius:20px; border:1px solid rgba(250,246,239,0.25);
    background:rgba(250,246,239,0.08); color:var(--bone); font-size:0.9rem; font-family:inherit;
  }
  #threadInput::placeholder{color:rgba(250,246,239,0.4);}
  #threadSend{
    background:var(--honey-bright); color:var(--bark); border:none; border-radius:20px;
    padding:0.7rem 1.2rem; font-weight:600; font-size:0.9rem; cursor:pointer;
  }

  @media (min-width:760px){
    #main{position:relative;}
    #sessionList{width:340px; border-right:1px solid rgba(250,246,239,0.15);}
    #threadView{position:relative; width:auto; flex:1; display:flex;}
    #threadView:not(.open){align-items:center; justify-content:center;}
    #backBtn{display:none;}
  }
</style>
</head>
<body>

<div id="gate">
  <div>
    <p>This page is only for the site owner.</p>
    <p style="margin-top:1rem;"><a href="auth.html">Log in</a> with the admin account to view it.</p>
  </div>
</div>

<div id="app">
  <header>
    <h1>Steeecks Chat</h1>
    <button id="notifyBtn">Enable Notifications</button>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="requested">Requested <span class="tab-count" id="countRequested" style="display:none;">0</span></button>
    <button class="tab-btn" data-tab="active">Chat Windows <span class="tab-count" id="countActive" style="display:none;">0</span></button>
  </div>

  <div id="main">
    <div id="sessionList"></div>

    <div id="threadView">
      <div id="threadHeader">
        <button id="backBtn" aria-label="Back">&larr;</button>
        <div id="threadName">Select a chat</div>
      </div>
      <div id="threadMessages"></div>
      <form id="threadForm">
        <input type="text" id="threadInput" placeholder="Type a reply…" autocomplete="off">
        <button type="submit" id="threadSend">Send</button>
      </form>
    </div>
  </div>
</div>

<script type="module">
  import { supabase, ADMIN_EMAILS } from './supabase-client.js';

  const VAPID_PUBLIC_KEY = 'BMiC_cv2E0xsDwVwoFqCaNQqGvEe0V9PxLH0ro1bBos5ZgwblxFoSg6NiPrByEFav54Y1rK_L3fPsgIUvVEHUJ4';

  const gate = document.getElementById('gate');
  const app = document.getElementById('app');
  let adminEmail = null;
  let currentTab = 'requested';
  let currentSessionId = null;
  let sessionsCache = { requested: [], active: [] };
  let messageChannel = null;

  function timeAgo(iso){
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'now';
    if (mins < 60) return mins + 'm';
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return hrs + 'h';
    return Math.floor(hrs / 24) + 'd';
  }

  function renderSessionList(){
    const list = sessionsCache[currentTab];
    const el = document.getElementById('sessionList');
    if (!list || list.length === 0){
      el.innerHTML = '<div id="emptyState">' + (currentTab === 'requested' ? "No new chat requests right now." : "No active chat windows yet.") + '</div>';
      return;
    }
    el.innerHTML = list.map(s => `
      <button class="session-item ${s.session_id === currentSessionId ? 'selected' : ''}" data-session="${s.session_id}">
        <div class="sname">${s.customer_name || 'Customer'} <span class="stime">${timeAgo(s.last_message_at)}</span></div>
        <div class="spreview">${s.last_message_sender === 'admin' ? 'You: ' : ''}${(s.last_message_preview || '').replace(/</g,'&lt;')}</div>
      </button>
    `).join('');
    el.querySelectorAll('.session-item').forEach(btn => {
      btn.addEventListener('click', () => openThread(btn.dataset.session));
    });
  }

  function updateCounts(){
    const rc = document.getElementById('countRequested');
    const ac = document.getElementById('countActive');
    const rn = sessionsCache.requested.length;
    const an = sessionsCache.active.length;
    rc.textContent = rn; rc.style.display = rn > 0 ? 'inline-block' : 'none';
    ac.textContent = an; ac.style.display = an > 0 ? 'inline-block' : 'none';
  }

  async function loadSessions(){
    const { data } = await supabase
      .from('chat_sessions')
      .select('session_id, customer_name, status, last_message_at, last_message_preview, last_message_sender')
      .order('last_message_at', { ascending: false });
    sessionsCache.requested = (data || []).filter(s => s.status === 'requested');
    sessionsCache.active = (data || []).filter(s => s.status === 'active');
    updateCounts();
    renderSessionList();
  }

  function renderMessage(m){
    const div = document.createElement('div');
    div.className = 'msg ' + (m.sender === 'admin' ? 'admin' : 'customer');
    div.textContent = m.message;
    document.getElementById('threadMessages').appendChild(div);
  }

  async function openThread(sessionId){
    currentSessionId = sessionId;
    const allSessions = [...sessionsCache.requested, ...sessionsCache.active];
    const s = allSessions.find(x => x.session_id === sessionId);
    document.getElementById('threadName').textContent = (s && s.customer_name) || 'Customer';
    document.getElementById('threadView').classList.add('open');
    renderSessionList();

    const { data } = await supabase
      .from('chat_messages')
      .select('sender, message, created_at')
      .eq('session_id', sessionId)
      .order('created_at', { ascending: true });
    const msgsEl = document.getElementById('threadMessages');
    msgsEl.innerHTML = '';
    (data || []).forEach(renderMessage);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    // Mark session read/active if it wasn't already (opening it counts as engaging)
    await supabase.from('chat_sessions').update({ admin_last_read_at: new Date().toISOString() }).eq('session_id', sessionId);

    if (messageChannel) supabase.removeChannel(messageChannel);
    messageChannel = supabase
      .channel('thread_' + sessionId)
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages', filter: `session_id=eq.${sessionId}` }, (payload) => {
        if (payload.new.sender === 'customer' && payload.new.session_id === currentSessionId){
          renderMessage(payload.new);
          msgsEl.scrollTop = msgsEl.scrollHeight;
        }
      })
      .subscribe();
  }

  function closeThread(){
    document.getElementById('threadView').classList.remove('open');
    currentSessionId = null;
    if (messageChannel){ supabase.removeChannel(messageChannel); messageChannel = null; }
  }

  document.getElementById('backBtn').addEventListener('click', closeThread);

  document.getElementById('threadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const input = document.getElementById('threadInput');
    const text = input.value.trim();
    if (!text || !currentSessionId) return;
    input.value = '';
    renderMessage({ sender: 'admin', message: text });
    document.getElementById('threadMessages').scrollTop = 999999;
    await supabase.from('chat_messages').insert({
      session_id: currentSessionId, sender: 'admin', name: 'Danny', message: text
    });
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTab = btn.dataset.tab;
      renderSessionList();
    });
  });

  // ===== Push notifications =====
  function urlBase64ToUint8Array(base64String){
    const padding = '='.repeat((4 - base64String.length % 4) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
  }

  async function setupPush(){
    const btn = document.getElementById('notifyBtn');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)){
      btn.style.display = 'none';
      return;
    }
    const reg = await navigator.serviceWorker.register('sw.js');
    const existing = await reg.pushManager.getSubscription();
    if (existing && Notification.permission === 'granted'){
      btn.textContent = 'Notifications On';
      btn.classList.add('granted');
    }
    btn.addEventListener('click', async () => {
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') return;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
      const subJson = sub.toJSON();
      await supabase.from('push_subscriptions').upsert({
        admin_email: adminEmail,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth: subJson.keys.auth
      }, { onConflict: 'endpoint' });
      btn.textContent = 'Notifications On';
      btn.classList.add('granted');
    });

    navigator.serviceWorker.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'notification-click' && event.data.session_id){
        loadSessions().then(() => openThread(event.data.session_id));
      }
    });
  }

  // ===== Live updates to the session lists =====
  function subscribeSessionUpdates(){
    supabase
      .channel('chat_sessions_admin')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_sessions' }, () => {
        loadSessions();
      })
      .subscribe();
  }

  async function init(){
    const { data: { session } } = await supabase.auth.getSession();
    if (!session || !ADMIN_EMAILS.includes(session.user.email)){
      return;
    }
    adminEmail = session.user.email;
    gate.style.display = 'none';
    app.classList.add('ready');
    await loadSessions();
    subscribeSessionUpdates();
    setupPush();
  }

  init();
</script>
</body>
</html>
